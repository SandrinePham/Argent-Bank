openapi: 3.0.3
info:
  title: Argent Bank API
  description: API pour la gestion des transactions de l'utilisateur connecté.
  version: 1.0.0

servers:
  - url: http://localhost:3001/api/v1

tags:
  - name: transactions
    description: Opérations liées aux transactions

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Erreur d’authentification"

    Transaction:
      type: object
      properties:
        id:
          type: string
          example: txn_987
        date:
          type: string
          format: date
          example: "2025-06-23"
        type:
          type: string
          example: "Withdrawal"
        amount:
          type: number
          format: float
          example: 50.00
        description:
          type: string
          example: "Retrait DAB"

security:
  - bearerAuth: []

paths:
  /user/transactions:
    get:
      summary: Récupérer toutes les transactions de l'utilisateur connecté
      tags:
        - transactions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Transactions récupérées avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  body:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
        "401":
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/{transactionId}:
    get:
      summary: Récupérer le détail d'une transaction
      tags:
        - transactions
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
          description: ID de la transaction à récupérer
      responses:
        "200":
          description: Détail de la transaction récupéré
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  body:
                    $ref: "#/components/schemas/Transaction"
        "401":
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transaction non trouvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Modifier le détail d'une transaction
      tags:
        - transactions
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
          description: ID de la transaction à modifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  example: "Paiement restaurant"
                type:
                  type: string
                  example: "Debit"
              required:
                - description
      responses:
        "200":
          description: Transaction mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  body:
                    $ref: "#/components/schemas/Transaction"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transaction non trouvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
